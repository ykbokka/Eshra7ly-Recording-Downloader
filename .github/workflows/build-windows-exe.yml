name: Build standalone Windows EXE

on:
  push:
    branches:
      - feature/macos-desktop-gui
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: course_archiver/requirements.txt

      - name: Install application and packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r course_archiver/requirements.txt pyinstaller

      - name: Install bundled headless Chromium
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $browserPath = Join-Path $env:GITHUB_WORKSPACE "course_archiver\browser"
          New-Item -ItemType Directory -Force -Path $browserPath | Out-Null
          $env:PLAYWRIGHT_BROWSERS_PATH = $browserPath
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw "Playwright Chromium installation failed." }

      - name: Download and stage FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg-release-essentials.zip"
          $extract = Join-Path $env:RUNNER_TEMP "ffmpeg-extract"
          New-Item -ItemType Directory -Force -Path $extract, "build-tools" | Out-Null
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $extract -Force

          $ffmpeg = Get-ChildItem -Path $extract -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
          $ffprobe = Get-ChildItem -Path $extract -Filter "ffprobe.exe" -Recurse | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) {
            throw "FFmpeg archive is missing ffmpeg.exe or ffprobe.exe."
          }
          $licensePath = Join-Path $ffmpeg.Directory.Parent.FullName "LICENSE.txt"
          if (-not (Test-Path $licensePath)) {
            throw "The FFmpeg package root is missing LICENSE.txt."
          }

          Copy-Item $ffmpeg.FullName "build-tools\ffmpeg.exe" -Force
          Copy-Item $ffprobe.FullName "build-tools\ffprobe.exe" -Force
          Copy-Item $licensePath "build-tools\FFmpeg-LICENSE.txt" -Force

          & "build-tools\ffmpeg.exe" -hide_banner -version
          if ($LASTEXITCODE -ne 0) { throw "Bundled FFmpeg did not start." }
          & "build-tools\ffprobe.exe" -hide_banner -version
          if ($LASTEXITCODE -ne 0) { throw "Bundled FFprobe did not start." }

      - name: Check Python source syntax
        shell: pwsh
        run: |
          python -m compileall -q course_archiver
          if ($LASTEXITCODE -ne 0) { throw "Python syntax check failed." }

      - name: Build one-file GUI executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m PyInstaller --noconfirm --clean Eshra7lyDownloader.spec
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller build failed." }
          if (-not (Test-Path "dist\Eshra7lyDownloader.exe")) {
            throw "The expected executable was not produced."
          }
          Get-Item "dist\Eshra7lyDownloader.exe" | Select-Object Name, Length

      - name: Upload standalone EXE
        uses: actions/upload-artifact@v4
        with:
          name: Eshra7lyDownloader-Windows-x64
          path: dist/Eshra7lyDownloader.exe
          if-no-files-found: error
          retention-days: 14
